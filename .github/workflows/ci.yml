name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run mini-seq validate examples/sequence.yaml
          uv run mini-seq demo --units 20 --seed 1 --db smoke.sqlite --timeout 0.2
          uv run mini-seq summary --db smoke.sqlite

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build sdist and wheel
        run: uv build
      - name: Install wheel in a clean environment
        run: |
          uv venv --python 3.13 /tmp/wheel-env
          uv pip install --python /tmp/wheel-env/bin/python dist/*.whl
          /tmp/wheel-env/bin/mini-seq --help
          /tmp/wheel-env/bin/mini-seq demo --units 10 --seed 1 --db /tmp/w.sqlite --timeout 0.2
